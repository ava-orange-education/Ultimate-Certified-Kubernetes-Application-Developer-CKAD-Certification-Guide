apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avakart-api-ingress
  namespace: avakart
  labels:
    app: api-services
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://avakart.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.avakart.example.com
    secretName: avakart-api-tls
  rules:
  - host: api.avakart.example.com
    http:
      paths:
      - path: /books(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: books-service
            port:
              number: 80
      - path: /storage(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: storage-service
            port:
              number: 80
      - path: /orders(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: order-processor-service
            port:
              number: 80
