apiVersion: v1
kind: Service
metadata:
  name: books-service-external
  namespace: avakart
  labels:
    app: books-service
    component: backend
    tier: api
    access: external
spec:
  type: NodePort
  selector:
    app: books-service
  ports:
  - name: http
    port: 80
    targetPort: 8081
    nodePort: 30081
    protocol: TCP
