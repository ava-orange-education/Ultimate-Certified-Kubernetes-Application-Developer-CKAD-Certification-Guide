apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: avakart
  labels:
    app: storage-service
    component: backend
    tier: api
spec:
  type: ClusterIP
  selector:
    app: storage-service
  ports:
  - name: http
    port: 80
    targetPort: 8082
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: 9000
    protocol: TCP
