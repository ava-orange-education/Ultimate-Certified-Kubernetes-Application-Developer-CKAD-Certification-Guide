apiVersion: v1
kind: Service
metadata:
  name: books-service
  namespace: avakart
  labels:
    app: books-service
    component: backend
    tier: api
spec:
  type: ClusterIP
  selector:
    app: books-service
  ports:
  - name: http
    port: 80
    targetPort: 8081
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
