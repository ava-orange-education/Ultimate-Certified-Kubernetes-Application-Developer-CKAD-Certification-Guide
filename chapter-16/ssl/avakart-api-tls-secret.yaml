apiVersion: v1
kind: Secret
metadata:
  name: avakart-api-tls
  namespace: avakart
  labels:
    app: avakart
    component: tls
    service: api
type: kubernetes.io/tls
data:
  # Base64 encoded certificate for API subdomain (replace with actual certificate)
  # This is a placeholder - in production, use actual certificates from a CA
  tls.crt: 
  # Base64 encoded private key for API subdomain (replace with actual private key)
  tls.key: 
