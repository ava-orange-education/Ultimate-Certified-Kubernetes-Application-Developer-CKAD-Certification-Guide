# Storage Service Egress Network Policy
# Allows storage service to communicate with database only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-service-egress-policy
  namespace: avakart
  labels:
    app: storage-service
    policy-type: egress
    tier: backend
spec:
  podSelector:
    matchLabels:
      app: storage-service
  policyTypes:
  - Egress
  egress:
  # Allow communication to database in database namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow communication to Redis cache (if used)
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow backup to external storage (S3, etc.)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 172.16.0.0/12
    ports:
    - protocol: TCP
      port: 443
