# Storage Service Ingress Network Policy
# Allows access to storage service from books service and order processor only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-service-ingress-policy
  namespace: avakart
  labels:
    app: storage-service
    policy-type: ingress
    tier: backend
spec:
  podSelector:
    matchLabels:
      app: storage-service
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic from books service
  - from:
    - podSelector:
        matchLabels:
          app: books-service
    ports:
    - protocol: TCP
      port: 8082
  # Allow traffic from order processor
  - from:
    - podSelector:
        matchLabels:
          app: order-processor
    ports:
    - protocol: TCP
      port: 8082
  # Allow health checks from kube-system (for probes)
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 8082
  # Allow monitoring from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8082
