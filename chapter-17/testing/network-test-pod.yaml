# Network Test Pod for Network Policy Validation
# This pod contains network troubleshooting tools for testing network policies
apiVersion: v1
kind: Pod
metadata:
  name: network-test-pod
  namespace: avakart
  labels:
    app: network-test
    purpose: troubleshooting
spec:
  containers:
  - name: network-test
    image: nicolaka/netshoot
    command: ["/bin/bash"]
    args: ["-c", "while true; do sleep 30; done;"]
    securityContext:
      capabilities:
        add: ["NET_ADMIN", "NET_RAW"]
      runAsUser: 0
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  restartPolicy: Always
---
