# Network Policy Monitoring ConfigMap
# Contains scripts and configurations for monitoring network policy effectiveness
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-policy-monitor
  namespace: monitoring
  labels:
    app: network-policy-monitor
    component: monitoring
data:
  monitor.sh: |
    #!/bin/bash
    
    # Network Policy Monitoring Script
    # Monitors network policy compliance and effectiveness
    
    NAMESPACE="avakart"
    LOG_FILE="/var/log/network-policy-monitor.log"
    
    log() {
        echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a $LOG_FILE
    }
    
    check_policies() {
        log "Checking Network Policy compliance..."
        
        # Check for pods without Network Policies
        kubectl get pods -n $NAMESPACE -o json | \
          jq -r '.items[] | select(.metadata.labels != null) | 
                 "\(.metadata.namespace)/\(.metadata.name): \(.metadata.labels)"' | \
          while read line; do
            namespace=$(echo $line | cut -d'/' -f1)
            pod=$(echo $line | cut -d'/' -f2 | cut -d':' -f1)
            
            # Check if namespace has any Network Policies
            policies=$(kubectl get networkpolicies -n $namespace --no-headers 2>/dev/null | wc -l)
            if [ $policies -eq 0 ]; then
              log "WARNING: Namespace $namespace has no Network Policies"
            fi
          done
        
        # Check for default deny policies
        default_deny=$(kubectl get networkpolicies -n $NAMESPACE -o json | \
          jq -r '.items[] | select(.spec.podSelector == {} and (.spec.policyTypes | contains(["Ingress", "Egress"]))) | .metadata.name')
        
        if [ -z "$default_deny" ]; then
          log "WARNING: No default deny policy found in namespace $NAMESPACE"
        else
          log "INFO: Default deny policy found: $default_deny"
        fi
        
        # Check for DNS egress rules
        dns_policies=$(kubectl get networkpolicies -n $NAMESPACE -o json | \
          jq -r '.items[] | select(.spec.egress[]?.to[]? == [] and .spec.egress[]?.ports[]?.port == 53) | .metadata.name')
        
        if [ -z "$dns_policies" ]; then
          log "WARNING: No DNS egress rules found - pods may not resolve DNS"
        else
          log "INFO: DNS egress policies found: $dns_policies"
        fi
    }
    
    check_connectivity() {
        log "Testing connectivity patterns..."
        
        # Test expected connections
        if kubectl exec -n $NAMESPACE deployment/frontend -- timeout 5 curl -s http://books-service:8081/health >/dev/null 2>&1; then
          log "INFO: Frontend → Books Service: ALLOWED (expected)"
        else
          log "ERROR: Frontend → Books Service: BLOCKED (unexpected)"
        fi
        
        # Test blocked connections
        if kubectl exec -n $NAMESPACE deployment/frontend -- timeout 5 curl -s http://storage-service:8082/health >/dev/null 2>&1; then
          log "ERROR: Frontend → Storage Service: ALLOWED (should be blocked)"
        else
          log "INFO: Frontend → Storage Service: BLOCKED (expected)"
        fi
    }
    
    generate_report() {
        log "Generating Network Policy compliance report..."
        
        echo "Network Policy Compliance Report - $(date)" > /tmp/network-policy-report.txt
        echo "=============================================" >> /tmp/network-policy-report.txt
        echo "" >> /tmp/network-policy-report.txt
        
        # Policy count
        policy_count=$(kubectl get networkpolicies -n $NAMESPACE --no-headers | wc -l)
        echo "Total Network Policies: $policy_count" >> /tmp/network-policy-report.txt
        
        # List all policies
        echo "" >> /tmp/network-policy-report.txt
        echo "Applied Policies:" >> /tmp/network-policy-report.txt
        kubectl get networkpolicies -n $NAMESPACE -o custom-columns=NAME:.metadata.name,POLICY-TYPES:.spec.policyTypes --no-headers >> /tmp/network-policy-report.txt
        
        # Pod coverage
        echo "" >> /tmp/network-policy-report.txt
        echo "Pod Coverage Analysis:" >> /tmp/network-policy-report.txt
        kubectl get pods -n $NAMESPACE -o custom-columns=NAME:.metadata.name,LABELS:.metadata.labels --no-headers >> /tmp/network-policy-report.txt
        
        log "Report generated at /tmp/network-policy-report.txt"
    }
    
    main() {
        log "Starting Network Policy monitoring cycle..."
        check_policies
        check_connectivity
        generate_report
        log "Monitoring cycle completed"
    }
    
    # Run monitoring cycle
    while true; do
        main
        sleep 300  # Run every 5 minutes
    done

  prometheus-rules.yaml: |
    groups:
    - name: network-policy-alerts
      rules:
      - alert: NetworkPolicyMissing
        expr: kube_namespace_created{namespace="avakart"} unless on(namespace) kube_networkpolicy_created{namespace="avakart"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Namespace {{ $labels.namespace }} has no Network Policies"
          description: "The namespace {{ $labels.namespace }} does not have any Network Policies applied, which may pose a security risk."
      
      - alert: DefaultDenyPolicyMissing
        expr: |
          (
            count by (namespace) (kube_networkpolicy_spec_ingress_rules{namespace="avakart"} == 0) == 0
          ) or (
            count by (namespace) (kube_networkpolicy_spec_egress_rules{namespace="avakart"} == 0) == 0
          )
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Default deny policy missing in namespace {{ $labels.namespace }}"
          description: "No default deny Network Policy found in namespace {{ $labels.namespace }}. This is a security risk."
      
      - alert: NetworkPolicyViolation
        expr: increase(network_policy_drops_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High number of network policy violations detected"
          description: "{{ $value }} network policy violations detected in the last 5 minutes."

  grafana-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Network Policy Monitoring",
        "tags": ["kubernetes", "network-policy", "security"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Network Policies by Namespace",
            "type": "stat",
            "targets": [
              {
                "expr": "count by (namespace) (kube_networkpolicy_created)",
                "legendFormat": "{{ namespace }}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "palette-classic"
                },
                "unit": "short"
              }
            }
          },
          {
            "id": 2,
            "title": "Network Policy Violations",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(network_policy_drops_total[5m])",
                "legendFormat": "Drops per second"
              }
            ]
          },
          {
            "id": 3,
            "title": "Pod Network Policy Coverage",
            "type": "table",
            "targets": [
              {
                "expr": "kube_pod_info * on(namespace, pod) group_left() (kube_networkpolicy_spec_pod_selector_match_labels > 0)",
                "format": "table"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
---
# Network Policy Monitor Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-policy-monitor
  namespace: monitoring
  labels:
    app: network-policy-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-policy-monitor
  template:
    metadata:
      labels:
        app: network-policy-monitor
    spec:
      serviceAccountName: network-policy-monitor
      containers:
      - name: monitor
        image: bitnami/kubectl:latest
        command: ["/bin/bash"]
        args: ["/scripts/monitor.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: logs
          mountPath: /var/log
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: NAMESPACE
          value: "avakart"
      volumes:
      - name: scripts
        configMap:
          name: network-policy-monitor
          defaultMode: 0755
      - name: logs
        emptyDir: {}
---
# Service Account for Network Policy Monitor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-policy-monitor
  namespace: monitoring
---
# ClusterRole for Network Policy Monitor
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-policy-monitor
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
# ClusterRoleBinding for Network Policy Monitor
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-policy-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-policy-monitor
subjects:
- kind: ServiceAccount
  name: network-policy-monitor
  namespace: monitoring
