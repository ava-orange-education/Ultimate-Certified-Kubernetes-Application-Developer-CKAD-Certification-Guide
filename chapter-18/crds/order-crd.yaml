apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orders.avakart.io
  labels:
    app.kubernetes.io/name: avakart
    app.kubernetes.io/component: crd
    app.kubernetes.io/part-of: avakart-platform
spec:
  group: avakart.io
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Customer
      type: string
      description: Customer ID
      jsonPath: .spec.customerId
    - name: Items
      type: integer
      description: Number of items
      jsonPath: .spec.itemCount
    - name: Total
      type: number
      description: Total amount
      jsonPath: .status.totalAmount
    - name: Status
      type: string
      description: Order status
      jsonPath: .status.phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              customerId:
                type: string
                minLength: 1
                description: "Unique customer identifier"
              itemCount:
                type: integer
                minimum: 1
                description: "Total number of items in order"
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    bookId:
                      type: string
                      description: "Book identifier"
                    quantity:
                      type: integer
                      minimum: 1
                      description: "Quantity of this book"
                    price:
                      type: number
                      minimum: 0
                      description: "Price per unit"
                  required:
                  - bookId
                  - quantity
                  - price
              shippingAddress:
                type: object
                properties:
                  street:
                    type: string
                    minLength: 1
                  city:
                    type: string
                    minLength: 1
                  state:
                    type: string
                    minLength: 2
                    maxLength: 2
                  zipCode:
                    type: string
                    pattern: '^[0-9]{5}(-[0-9]{4})?$'
                  country:
                    type: string
                    default: "US"
                    enum: ["US", "CA", "UK", "DE", "FR"]
                required:
                - street
                - city
                - state
                - zipCode
              paymentMethod:
                type: string
                enum: ["credit-card", "debit-card", "paypal", "bank-transfer"]
                description: "Payment method used"
            required:
            - customerId
            - itemCount
            - items
            - shippingAddress
            - paymentMethod
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["pending", "processing", "shipped", "delivered", "cancelled"]
                description: "Current order phase"
              orderDate:
                type: string
                format: date-time
                description: "Order creation timestamp"
              totalAmount:
                type: number
                minimum: 0
                description: "Total order amount"
              trackingNumber:
                type: string
                description: "Shipping tracking number"
              estimatedDelivery:
                type: string
                format: date-time
                description: "Estimated delivery date"
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
  scope: Namespaced
  names:
    plural: orders
    singular: order
    kind: Order
    shortNames:
    - ord
  subresources:
    status: {}
