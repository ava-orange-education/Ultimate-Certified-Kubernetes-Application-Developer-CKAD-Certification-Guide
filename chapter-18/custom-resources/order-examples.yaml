# Valid Order examples for AvaKart application
---
apiVersion: avakart.io/v1
kind: Order
metadata:
  name: order-001
  namespace: avakart
  labels:
    customer-tier: premium
    priority: high
    app.kubernetes.io/name: avakart
    app.kubernetes.io/component: order-management
spec:
  customerId: "customer-12345"
  itemCount: 3
  items:
  - bookId: "kubernetes-guide"
    quantity: 2
    price: 49.99
  - bookId: "cloud-native-patterns"
    quantity: 1
    price: 39.99
  shippingAddress:
    street: "123 Tech Street"
    city: "San Francisco"
    state: "CA"
    zipCode: "94105"
    country: "US"
  paymentMethod: "credit-card"
---
apiVersion: avakart.io/v1
kind: Order
metadata:
  name: order-002
  namespace: avakart
  labels:
    customer-tier: standard
    priority: normal
    app.kubernetes.io/name: avakart
    app.kubernetes.io/component: order-management
spec:
  customerId: "customer-67890"
  itemCount: 1
  items:
  - bookId: "fiction-bestseller"
    quantity: 1
    price: 24.99
  shippingAddress:
    street: "456 Main Avenue"
    city: "New York"
    state: "NY"
    zipCode: "10001-1234"
    country: "US"
  paymentMethod: "paypal"
---
