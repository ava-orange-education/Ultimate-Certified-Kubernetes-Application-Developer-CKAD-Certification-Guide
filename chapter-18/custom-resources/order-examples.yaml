    country: "US"
  paymentMethod: "debit-card"
---
# Order with status example (showing how status might be updated by an operator)
apiVersion: avakart.io/v1
kind: Order
metadata:
  name: order-with-status
  namespace: avakart
  labels:
    customer-tier: premium
    priority: high
    app.kubernetes.io/name: avakart
    app.kubernetes.io/component: order-management
spec:
  customerId: "customer-33333"
  itemCount: 2
  items:
  - bookId: "kubernetes-guide"
    quantity: 2
    price: 49.99
  shippingAddress:
    street: "123 Tech Street"
    city: "San Francisco"
    state: "CA"
    zipCode: "94105"
    country: "US"
  paymentMethod: "credit-card"
status:
  phase: "processing"
  orderDate: "2024-01-15T10:30:00Z"
  totalAmount: 99.98
  trackingNumber: "TRK123456789"
  estimatedDelivery: "2024-01-20T18:00:00Z"
  conditions:
  - type: "PaymentProcessed"
    status: "True"
    reason: "PaymentSuccessful"
    message: "Payment processed successfully"
    lastTransitionTime: "2024-01-15T10:31:00Z"
  - type: "InventoryReserved"
    status: "True"
    reason: "InventoryAvailable"
    message: "Items reserved from inventory"
    lastTransitionTime: "2024-01-15T10:32:00Z"
