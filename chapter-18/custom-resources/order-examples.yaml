---
apiVersion: avakart.io/v1
kind: Order
metadata:
  name: order-004
  namespace: avakart
  labels:
    customer-tier: standard
    priority: normal
    app.kubernetes.io/name: avakart
    app.kubernetes.io/component: order-management
spec:
  customerId: "customer-22222"
  itemCount: 2
  items:
  - bookId: "cloud-native-patterns"
    quantity: 1
